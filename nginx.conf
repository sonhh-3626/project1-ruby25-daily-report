events {
    worker_connections 1024;
}

http {
    upstream rails_app {
        server web:3000;
    }

    server {
        listen 80;
        server_name 3.27.189.206;

        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name 3.27.189.206;

        # SSL Configuration
        ssl_certificate /home/ha.hong.son@sun-asterisk.com/Documents/Intern/Project1_rails/project1-ruby25-daily-report/config/ssl/server.crt;
        ssl_certificate_key /home/ha.hong.son@sun-asterisk.com/Documents/Intern/Project1_rails/project1-ruby25-daily-report/config/ssl/server.key;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Upload size
        client_max_body_size 10M;

        # Proxy to Rails app
        location / {
            proxy_pass http://rails_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://rails_app/health;
        }
    }
}
